<div class="h-screen flex flex-col bg-slate-100">

  <!-- TOP BAR -->
  <header class="h-14 bg-slate-900 text-white flex items-center px-6 justify-between shadow-md">
    <div class="text-lg font-semibold tracking-wide">
      🚗 Vigiliner
    </div>

    <nav class="flex gap-6 text-sm">
      <span class="hover:text-slate-300 cursor-pointer">Dashboard</span>
      <span class="hover:text-slate-300 cursor-pointer">Historial</span>
      <span class="hover:text-slate-300 cursor-pointer">Reportes</span>
      <button
        (click)="logout()" class="text-sm bg-red-600 hover:bg-red-500 px-3 py-1 rounded-md transition">
        Cerrar sesión
      </button>
    </nav>

    <div class="text-xs text-slate-400">
      En línea
    </div>
  </header>

  <!-- CONTENIDO -->
  <div class="flex flex-1 overflow-hidden">

    <!-- SIDEBAR UNIDADES -->
    <div class="bg-white border-r border-slate-200 transition-all duration-300"
         [ngClass]="{
           'w-72': isSidebarOpen,
           'w-0': !isSidebarOpen,
         }">
      <app-sidebar></app-sidebar>
    </div>


    <!-- MAPA -->
    <main class="flex-1 relative">
      <app-map></app-map>
    </main>

    <button
      mat-fab
      (click)="toggleSidebar()"
      class="!absolute bottom-6 right-6 z-[3000] shadow-2xl"
      [ngClass]="{'right-6': !selectedUnit, 'right-[22rem]': selectedUnit}"
      color="primary">
    <mat-icon>
      {{ isSidebarOpen ? 'directions_car' : 'menu' }}
    </mat-icon>
    </button>

  </div>
</div>
