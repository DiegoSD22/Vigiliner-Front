<h2 mat-dialog-title>
  Crear Usuario
</h2>

<mat-dialog-content class="mat-typography">
  <form [formGroup]="userForm" (ngSubmit)="saveUser()" class="flex flex-col gap-4">
    
    <mat-form-field>
      <mat-label>Nombre</mat-label>
      <input matInput formControlName="name" placeholder="Ingrese el nombre del usuario">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Email</mat-label>
      <input matInput formControlName="email" placeholder="Ingrese el email del usuario">
    </mat-form-field>

    <mat-form-field>
      <mat-label>Contraseña</mat-label>
      <input matInput formControlName="password" placeholder="Ingrese la contraseña del usuario" type="password">
    </mat-form-field>

    <mat-dialog-actions align="center" class="flex gap-4">
      <button mat-dialog-close class="btn btn-outline text-black" type="button">Cancelar</button>
      <button class="btn btn-outline btn-success" type="submit">Guardar</button>
      <!-- <button matButton [mat-dialog-close]="true" cdkFocusInitial>Install</button> -->
    </mat-dialog-actions>

  </form>

  </mat-dialog-content>
