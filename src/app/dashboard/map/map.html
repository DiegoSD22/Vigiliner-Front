<div class="flex h-screen w-full">

  <!-- Mapa -->
  <div class="flex-1 relative">
    <div id="map" class="h-full w-full"></div>
  </div>

  <div *ngIf="backgroundTrackingEnabled && !isMiniMinimized"
     #miniWrapper
     class="absolute bottom-6 right-6 w-72 h-44 bg-slate-900 rounded-xl shadow-2xl z-[4000] overflow-hidden
            transition-all duration-300 ease-out
            animate-[fadeIn_.25s_ease-out]">
  <div *ngIf="isMiniMinimized"
     (click)="isMiniMinimized = false"
     class="absolute bottom-6 right-6 w-14 h-14
            bg-blue-600 rounded-full shadow-xl
            flex items-center justify-center
            cursor-pointer z-[4000]
            hover:scale-110 transition">

        🚗
        </div>

    <!-- HEADER DRAGGABLE -->
    <div #miniHeader
        class="h-9 bg-slate-800 text-white text-xs px-3 flex items-center justify-between cursor-move select-none">
        Seguimiento activo
        <button (click)="isMiniMinimized = true">-</button>
        <button (click)="toggleBackgroundTracking()">✕</button>
    </div>

    <!-- MAPA -->
    <div class="h-[calc(100%-36px)]">
        <div #miniMapContainer class="w-full h-full"></div>
    </div>

    </div>

  <!-- Panel derecho -->
  <div *ngIf="selectedUnit"
       class="w-80 bg-slate-900 text-white shadow-2xl p-6 transition-all duration-300">

    <div class="flex justify-between items-center mb-6">
      <h2 class="text-xl font-bold">
        {{ selectedUnit.alias }}
      </h2>

      <button
        (click)="selectedUnit = null"
        class="text-slate-400 hover:text-white">
        ✕
      </button>
    </div>

    <!-- Tabs -->
    <div class="flex border-b border-slate-700 mb-4">

    <button
        (click)="activeTab = 'info'"
        class="flex-1 py-2 text-sm transition"
        [ngClass]="{
        'text-white border-b-2 border-blue-500': activeTab === 'info',
        'text-slate-400': activeTab !== 'info'
        }">
        📍 Info
    </button>

    <button
        (click)="activeTab = 'stats'"
        class="flex-1 py-2 text-sm transition"
        [ngClass]="{
        'text-white border-b-2 border-blue-500': activeTab === 'stats',
        'text-slate-400': activeTab !== 'stats'
        }">
        📊 Stats
    </button>

    <button
        (click)="activeTab = 'history'"
        class="flex-1 py-2 text-sm transition"
        [ngClass]="{
        'text-white border-b-2 border-blue-500': activeTab === 'history',
        'text-slate-400': activeTab !== 'history'
        }">
        🛣 Historial
    </button>

    </div>

    <div class="space-y-4">
    <div *ngIf="activeTab === 'info'" class="space-y-6">
      <div>
        <div class="text-slate-400 text-xs">Velocidad</div>
        <div class="text-2xl font-semibold">
          {{ selectedUnit.speed || 0 }} km/h
        </div>
      </div>
      <div class="mt-2 h-2 bg-slate-700 rounded-full overflow-hidden">
        <div
            class="h-full transition-all duration-500"
            [style.width.%]="(selectedUnit.speed || 0) * 2"
            [ngClass]="{
            'bg-green-500': selectedUnit.speed > 40,
            'bg-yellow-400': selectedUnit.speed > 5 && selectedUnit.speed <= 40,
            'bg-gray-400': selectedUnit.speed <= 5
            }">
        </div>
      </div>

      <div>
        <div class="text-slate-400 text-xs">Estado</div>
        <div
          [ngClass]="{
            'text-green-400': selectedUnit.status === 'MOVING',
            'text-yellow-400': selectedUnit.status === 'STOPPED',
            'text-gray-400': selectedUnit.status === 'OFFLINE'
          }"
          class="font-semibold">
          {{ selectedUnit.status }}
        </div>
      </div>

      <div>
        <div class="text-slate-400 text-xs">Última conexión</div>
        <div>
          {{ selectedUnit.lastSeen | date:'mediumTime' }}
        </div>
      </div>
      <button
        (click)="toggleBackgroundTracking()"
        class="mt-4 w-full py-2 bg-blue-600 hover:bg-blue-700 rounded-lg text-sm transition">

        {{ backgroundTrackingEnabled ? 'Detener seguimiento' : 'Seguimiento en segundo plano' }}

        </button>
      </div>
      <!-- STATS -->
        <div *ngIf="activeTab === 'stats'" class="space-y-4">
        <div>Velocidad máxima (demo)</div>
        </div>

        <!-- HISTORY -->
        <div *ngIf="activeTab === 'history'" class="space-y-4">
        <div>Selector de fecha</div>
        <div>Replay de ruta </div>
        </div>

    </div>

  </div>

</div>
