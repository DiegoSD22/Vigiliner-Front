<div class="h-full flex flex-col">

  <!-- Header -->
  <div class="px-5 py-4 border-b border-slate-200">
    <h2 class="text-sm font-semibold text-slate-700 tracking-wide">
      Unidades
    </h2>
  </div>

  <!-- Lista -->
  <div class="flex-1 overflow-y-auto">

    <div *ngFor="let unit of units$ | async"
    (click)="selectUnit(unit)"
      class="mx-4 my-3 p-4 bg-white rounded-xl shadow-sm hover:shadow-md transition cursor-pointer border border-slate-100"

    >
      <div class="flex items-center justify-between">

        <!-- Alias -->
        <div class="flex flex-col">
          <span class="text-sm font-medium text-slate-800">
            {{ unit.name }}
          </span>

          <span class="text-xs text-slate-500">
            ID: {{ unit.id }}
          </span>
        </div>

        <!-- Estado -->
        <div class="flex items-center gap-2">
          <span 
            class="w-2 h-2 rounded-full"
            [ngClass]="{
              'bg-green-500': unit.status,
              'bg-gray-400': !unit.status
            }"
          ></span>

          <span class="text-xs text-slate-500">
            {{ unit.status ? 'En línea' : 'Offline' }}
          </span>
        </div>

      </div>
    </div>

  </div>

</div>
