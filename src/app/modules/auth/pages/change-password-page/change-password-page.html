<main class="auth-shell flex min-h-screen items-center px-4 py-8 sm:px-8">
  <div class="mx-auto w-full max-w-md overflow-hidden rounded-3xl border border-base-300/60 bg-base-100/80 shadow-2xl backdrop-blur">
    <section class="p-6 sm:p-10">
      <div class="mb-8 flex items-center justify-between">
        <a class="flex items-center gap-3" routerLink="/dashboard">
          <div class="grid h-10 w-10 place-items-center rounded-xl bg-primary text-primary-content shadow-lg shadow-primary/30">
            V
          </div>
          <div>
            <p class="brand-title text-lg leading-none">Vigiliner</p>
            <p class="text-xs opacity-70">Cambiar contraseña</p>
          </div>
        </a>
        <a class="btn btn-ghost btn-sm" routerLink="/dashboard">Volver</a>
      </div>

      <h2 class="brand-title text-3xl">Cambiar contraseña</h2>
      <p class="mt-2 text-sm opacity-75">
        Actualiza tu contraseña para mantener tu cuenta segura.
      </p>

      @if (successMessage()) {
        <div class="alert alert-success mt-6" role="alert" aria-live="polite">
          <span>{{ successMessage() }}</span>
        </div>
      }

      @if (errorMessage()) {
        <div class="alert alert-error mt-6" role="alert" aria-live="polite">
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form [formGroup]="changePasswordForm" (ngSubmit)="changePassword()" class="mt-7 space-y-5" novalidate>
        <label class="form-control w-full">
          <span class="label-text mb-2 text-sm">Contraseña actual</span>
          <div class="relative">
            <input
              [type]="showCurrentPassword() ? 'text' : 'password'"
              formControlName="currentPassword"
              autocomplete="current-password"
              class="input input-bordered w-full bg-base-200 pr-24"
              placeholder="Tu contraseña actual"
              [class.input-error]="currentPasswordControl?.invalid && currentPasswordControl?.touched"
            />
            <button
              type="button"
              class="btn btn-ghost btn-xs absolute right-2 top-1/2 -translate-y-1/2"
              (click)="toggleCurrentPasswordVisibility()"
              [attr.aria-label]="showCurrentPassword() ? 'Ocultar contrasena' : 'Mostrar contrasena'"
            >
              {{ showCurrentPassword() ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
          @if (currentPasswordControl?.touched && currentPasswordControl?.errors?.['required']) {
            <span class="label-text-alt mt-2 text-error">La contrasena actual es obligatoria.</span>
          }
        </label>

        <label class="form-control w-full">
          <span class="label-text mb-2 text-sm">Nueva contraseña</span>
          <div class="relative">
            <input
              [type]="showNewPassword() ? 'text' : 'password'"
              formControlName="newPassword"
              autocomplete="new-password"
              class="input input-bordered w-full bg-base-200 pr-24"
              placeholder="Minimo 6 caracteres"
              [class.input-error]="newPasswordControl?.invalid && newPasswordControl?.touched"
            />
            <button
              type="button"
              class="btn btn-ghost btn-xs absolute right-2 top-1/2 -translate-y-1/2"
              (click)="toggleNewPasswordVisibility()"
              [attr.aria-label]="showNewPassword() ? 'Ocultar contrasena' : 'Mostrar contrasena'"
            >
              {{ showNewPassword() ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
          @if (newPasswordControl?.touched && newPasswordControl?.errors?.['required']) {
            <span class="label-text-alt mt-2 text-error">La nueva contrasena es obligatoria.</span>
          }
          @if (newPasswordControl?.touched && newPasswordControl?.errors?.['minlength']) {
            <span class="label-text-alt mt-2 text-error">La contrasena debe tener al menos 6 caracteres.</span>
          }
        </label>

        <label class="form-control w-full">
          <span class="label-text mb-2 text-sm">Confirmar nueva contraseña</span>
          <div class="relative">
            <input
              [type]="showConfirmPassword() ? 'text' : 'password'"
              formControlName="confirmPassword"
              autocomplete="new-password"
              class="input input-bordered w-full bg-base-200 pr-24"
              placeholder="Repite tu nueva contrasena"
              [class.input-error]="confirmPasswordControl?.invalid && confirmPasswordControl?.touched"
            />
            <button
              type="button"
              class="btn btn-ghost btn-xs absolute right-2 top-1/2 -translate-y-1/2"
              (click)="toggleConfirmPasswordVisibility()"
              [attr.aria-label]="showConfirmPassword() ? 'Ocultar contrasena' : 'Mostrar contrasena'"
            >
              {{ showConfirmPassword() ? 'Ocultar' : 'Mostrar' }}
            </button>
          </div>
          @if (confirmPasswordControl?.touched && confirmPasswordControl?.errors?.['required']) {
            <span class="label-text-alt mt-2 text-error">Debes confirmar la nueva contrasena.</span>
          }
          @if (confirmPasswordControl?.touched && confirmPasswordControl?.errors?.['passwordMismatch']) {
            <span class="label-text-alt mt-2 text-error">Las contrasenas no coinciden.</span>
          }
        </label>

        <button type="submit" [disabled]="isLoading()" class="btn btn-primary w-full">
          @if (isLoading()) {
            <span class="loading loading-spinner loading-sm"></span>
          }
          {{ isLoading() ? 'Actualizando...' : 'Actualizar contraseña' }}
        </button>
      </form>
    </section>
  </div>
</main>
