<main class="auth-shell flex min-h-screen items-center px-4 py-8 sm:px-8">
  <div class="mx-auto w-full max-w-md overflow-hidden rounded-3xl border border-base-300/60 bg-base-100/80 shadow-2xl backdrop-blur">
    <section class="p-6 sm:p-10">
      <div class="mb-8 flex items-center justify-between">
        <a class="flex items-center gap-3" routerLink="/">
          <div class="grid h-10 w-10 place-items-center rounded-xl bg-primary text-primary-content shadow-lg shadow-primary/30">
            V
          </div>
          <div>
            <p class="brand-title text-lg leading-none">Vigiliner</p>
            <p class="text-xs opacity-70">Reenviar verificacion</p>
          </div>
        </a>
        <a class="btn btn-ghost btn-sm" routerLink="/auth/login">Volver</a>
      </div>

      <h2 class="brand-title text-3xl">Reenviar verificacion</h2>
      <p class="mt-2 text-sm opacity-75">
        ¿No recibiste el correo de verificacion? Ingresa tu email y te enviaremos uno nuevo.
      </p>

      @if (successMessage()) {
        <div class="alert alert-success mt-6" role="alert" aria-live="polite">
          <span>{{ successMessage() }}</span>
        </div>
      }

      @if (errorMessage()) {
        <div class="alert alert-error mt-6" role="alert" aria-live="polite">
          <span>{{ errorMessage() }}</span>
        </div>
      }

      <form [formGroup]="resendForm" (ngSubmit)="resendVerification()" class="mt-7 space-y-5" novalidate>
        <label class="form-control w-full">
          <span class="label-text mb-2 text-sm">Correo electronico</span>
          <input
            type="email"
            formControlName="email"
            autocomplete="email"
            class="input input-bordered w-full bg-base-200"
            placeholder="operador@vigiliner.com"
            [class.input-error]="emailControl?.invalid && emailControl?.touched"
          />
          @if (emailControl?.touched && emailControl?.errors?.['required']) {
            <span class="label-text-alt mt-2 text-error">El correo es obligatorio.</span>
          }
          @if (emailControl?.touched && emailControl?.errors?.['email']) {
            <span class="label-text-alt mt-2 text-error">Ingresa un correo valido.</span>
          }
        </label>

        <button type="submit" [disabled]="isLoading()" class="btn btn-primary w-full">
          @if (isLoading()) {
            <span class="loading loading-spinner loading-sm"></span>
          }
          {{ isLoading() ? 'Enviando...' : 'Reenviar verificacion' }}
        </button>
      </form>

      <p class="mt-6 text-center text-sm opacity-70">
        ¿Ya verificaste tu cuenta?
        <a class="link-primary" routerLink="/auth/login">Inicia sesion</a>
      </p>
    </section>
  </div>
</main>
