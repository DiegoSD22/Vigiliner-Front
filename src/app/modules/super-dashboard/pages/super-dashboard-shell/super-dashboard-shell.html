<div class="flex min-h-screen bg-base-200">
  <!-- Sidebar -->
  <aside 
    class="sticky top-0 h-screen border-r border-base-300 bg-base-100 transition-all duration-300"
    [class.w-64]="!menuCollapsed"
    [class.w-20]="menuCollapsed"
  >
    <div class="flex h-full flex-col">
      <!-- Header -->
      <div class="border-b border-base-300 p-4">
        <div class="flex items-center justify-between">
          <div class="flex items-center gap-3" [class.opacity-0]="menuCollapsed">
            <div class="flex h-10 w-10 items-center justify-center rounded-lg bg-linear-to-br from-secondary to-accent">
              <svg class="h-6 w-6 text-secondary-content" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m5.618-4.016A11.955 11.955 0 0112 2.944a11.955 11.955 0 01-8.618 3.04A12.02 12.02 0 003 9c0 5.591 3.824 10.29 9 11.622 5.176-1.332 9-6.03 9-11.622 0-1.042-.133-2.052-.382-3.016z" />
              </svg>
            </div>
            <div>
              <h2 class="text-sm font-bold">Vigiliner</h2>
              <p class="text-xs opacity-60">Super Admin</p>
            </div>
          </div>
          <button 
            (click)="toggleMenu()" 
            class="btn btn-circle btn-ghost btn-sm"
          >
            <svg class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16" />
            </svg>
          </button>
        </div>
      </div>

      <!-- Navigation -->
      <nav class="flex-1 overflow-y-auto p-3">
        <div class="mb-2 px-3 text-xs font-semibold uppercase opacity-50" [class.hidden]="menuCollapsed">
          Principal
        </div>
        <div class="space-y-1">
          <a 
            routerLink="/super-dashboard"
            [routerLinkActive]="'bg-primary text-primary-content'"
            [routerLinkActiveOptions]="{ exact: true }"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-base-200"
            [class.justify-center]="menuCollapsed"
          >
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1H5a1 1 0 01-1-1V5zM14 5a1 1 0 011-1h4a1 1 0 011 1v7a1 1 0 01-1 1h-4a1 1 0 01-1-1V5zM4 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1H5a1 1 0 01-1-1v-3zM14 16a1 1 0 011-1h4a1 1 0 011 1v3a1 1 0 01-1 1h-4a1 1 0 01-1-1v-3z" />
            </svg>
            <span [class.hidden]="menuCollapsed">Dashboard Global</span>
          </a>

          <a 
            routerLink="/super-dashboard/empresas"
            routerLinkActive="bg-primary text-primary-content"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-base-200"
            [class.justify-center]="menuCollapsed"
          >
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 21V5a2 2 0 00-2-2H7a2 2 0 00-2 2v16m14 0h2m-2 0h-5m-9 0H3m2 0h5M9 7h1m-1 4h1m4-4h1m-1 4h1m-5 10v-5a1 1 0 011-1h2a1 1 0 011 1v5m-4 0h4" />
            </svg>
            <span [class.hidden]="menuCollapsed">Empresas</span>
          </a>

          <a 
            routerLink="/super-dashboard/unidades"
            routerLinkActive="bg-primary text-primary-content"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-base-200"
            [class.justify-center]="menuCollapsed"
          >
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 20l-5.447-2.724A1 1 0 013 16.382V5.618a1 1 0 011.447-.894L9 7m0 13l6-3m-6 3V7m6 10l4.553 2.276A1 1 0 0021 18.382V7.618a1 1 0 00-.553-.894L15 4m0 13V4m0 0L9 7" />
            </svg>
            <span [class.hidden]="menuCollapsed">Todas las Unidades</span>
          </a>
        </div>

        <div class="divider my-3" [class.mx-0]="menuCollapsed"></div>

        <div class="mb-2 px-3 text-xs font-semibold uppercase opacity-50" [class.hidden]="menuCollapsed">
          Sistema
        </div>
        <div class="space-y-1">
          <a 
            routerLink="/super-dashboard/usuarios"
            routerLinkActive="bg-primary text-primary-content"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-base-200"
            [class.justify-center]="menuCollapsed"
          >
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z" />
            </svg>
            <span [class.hidden]="menuCollapsed">Usuarios del Sistema</span>
          </a>

          <a 
            routerLink="/super-dashboard/monitoreo"
            routerLinkActive="bg-primary text-primary-content"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-base-200"
            [class.justify-center]="menuCollapsed"
          >
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
            </svg>
            <span [class.hidden]="menuCollapsed">Monitoreo en Vivo</span>
          </a>

          <a 
            routerLink="/super-dashboard/reportes"
            routerLinkActive="bg-primary text-primary-content"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-base-200"
            [class.justify-center]="menuCollapsed"
          >
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
            </svg>
            <span [class.hidden]="menuCollapsed">Reportes Globales</span>
          </a>

          <a 
            routerLink="/super-dashboard/configuracion"
            routerLinkActive="bg-primary text-primary-content"
            class="flex items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-base-200"
            [class.justify-center]="menuCollapsed"
          >
            <svg class="h-5 w-5 shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z" />
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
            </svg>
            <span [class.hidden]="menuCollapsed">Configuración</span>
          </a>
        </div>
      </nav>

      <!-- Footer -->
      <div class="border-t border-base-300 p-3">
        <button 
          class="flex w-full items-center gap-3 rounded-lg px-3 py-2.5 text-sm font-medium transition-colors hover:bg-base-200"
          [class.justify-center]="menuCollapsed"
        >
          <div class="avatar placeholder">
            <div class="w-8 rounded-full bg-linear-to-br from-primary to-secondary text-primary-content">
              <span class="text-xs font-bold">SA</span>
            </div>
          </div>
          <div [class.hidden]="menuCollapsed" class="flex-1 text-left">
            <p class="text-sm font-semibold">Super Admin</p>
            <p class="text-xs opacity-60">superadmin@vigiliner.com</p>
          </div>
        </button>
      </div>
    </div>
  </aside>

  <!-- Main Content -->
  <main class="flex-1 overflow-auto">
    <div class="p-6">
      <router-outlet></router-outlet>
    </div>
  </main>
</div>
