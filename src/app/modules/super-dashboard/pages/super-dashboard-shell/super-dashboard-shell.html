<main class="min-h-screen bg-base-200 text-base-content">
  <div class="mx-auto grid w-full max-w-7xl gap-4 p-4 md:grid-cols-[260px_1fr]">
    <aside class="rounded-2xl border border-base-300 bg-base-100 p-4 shadow-sm">
      <p class="badge badge-primary badge-outline">Super Admin</p>
      <h1 class="mt-3 text-xl font-bold">Control Total</h1>
      <p class="mt-1 text-sm opacity-75">Gestion global de empresas, unidades y operacion.</p>

      <nav class="mt-6 flex flex-col gap-2">
        <a class="btn btn-ghost justify-start" routerLink="/super-dashboard" [routerLinkActive]="'btn-active'" [routerLinkActiveOptions]="{ exact: true }">Resumen global</a>
        <a class="btn btn-ghost justify-start" routerLink="/super-dashboard/empresas" routerLinkActive="btn-active">Empresas</a>
        <a class="btn btn-ghost justify-start" routerLink="/super-dashboard/unidades" routerLinkActive="btn-active">Unidades</a>
      </nav>
    </aside>

    <section class="rounded-2xl border border-base-300 bg-base-100 p-4 shadow-sm">
      <router-outlet></router-outlet>
    </section>
  </div>
</main>
