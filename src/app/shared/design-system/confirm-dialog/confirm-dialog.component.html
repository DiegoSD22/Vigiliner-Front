@if (open()) {
  <div class="fixed inset-0 z-[60] grid place-items-center bg-black/45 px-4" role="dialog" aria-modal="true" [attr.aria-label]="ariaLabel()">
    <section class="w-full max-w-md rounded-2xl border border-base-300 bg-base-100 p-6 shadow-2xl">
      <div class="mb-4 grid h-12 w-12 place-items-center rounded-2xl bg-error/10 text-2xl text-error">
        !
      </div>

      <h3 class="text-xl font-bold">{{ title() }}</h3>
      <p class="mt-2 text-sm opacity-75">{{ message() }}</p>

      <div class="mt-6 flex justify-end gap-3">
        <button type="button" class="btn btn-ghost" [disabled]="busy()" (click)="onCancel()">
          {{ cancelLabel() }}
        </button>
        <button type="button" [class]="confirmButtonClass()" [disabled]="busy()" (click)="onConfirm()">
          @if (busy()) {
            <span class="loading loading-spinner loading-sm"></span>
          }
          {{ busy() ? 'Procesando...' : confirmLabel() }}
        </button>
      </div>
    </section>
  </div>
}
