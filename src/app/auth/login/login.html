<div class="min-h-screen bg-slate-950 flex items-center justify-center">

  <div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-2xl p-8 border border-slate-800">

    <!-- Logo / título -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-white tracking-wide">
        🚗 Vigiliner
      </h1>
      <p class="text-slate-400 text-sm mt-2">
        Plataforma de Rastreo Satelital
      </p>
    </div>

    <!-- ✅ Mensaje de error general con signal -->
    @if (errorMessage()) {
      <div class="alert alert-error">
      <span>{{ errorMessage() }}</span>
      </div>
    }

    <form [formGroup]="loginForm" (ngSubmit)="login()" class="space-y-5">

      <!-- Usuario -->
       <div class="mt-10">
        <label class="form-control w-full">
          <span class="label-text text-slate-400">Usuario</span>

          <input
            type="text"
            formControlName="email"
            class="input input-bordered w-full bg-slate-800 text-white"
            [class.input-error]="loginForm.get('email')?.invalid && loginForm.get('email')?.touched" />

            @if (loginForm.get('email')?.invalid && loginForm.get('email')?.touched) {
              <span class="label">
                <span class="label-text-alt text-error">
                  El correo/usuario es requerido
                </span>
              </span>
          }
        </label>
      </div>

      <!-- Password -->
      <label class="form-control w-full mt-4">
        <span class="mt-5 label-text text-slate-400">Contraseña</span>

        <input
          type="password"
          formControlName="password"
          class="input input-bordered w-full bg-slate-800 text-white"
          [class.input-error]="loginForm.get('password')?.invalid && loginForm.get('password')?.touched" />

        @if (loginForm.get('password')?.invalid && loginForm.get('password')?.touched) {
          <span class="label">
            <span class="label-text-alt text-error">
              La contraseña es requerida
            </span>
          </span>
        }
      </label>

      <button
        type="button"
        (click)="login()"
        [disabled]="isLoading()"
        class="mt-5 w-full py-2 bg-green-600 hover:bg-green-500 transition text-white font-medium rounded-lg">
        @if (isLoading()) {
          <span class="loading loading-spinner loading-sm"></span>
        }
        {{ isLoading() ? 'Iniciando...' : 'Iniciar sesión' }}
      </button>

    </form>

  </div>

</div>
