<div class="min-h-screen bg-slate-950 flex items-center justify-center">

  <div class="w-full max-w-md bg-slate-900 rounded-2xl shadow-2xl p-8 border border-slate-800">

    <!-- Logo / título -->
    <div class="text-center mb-8">
      <h1 class="text-2xl font-bold text-white tracking-wide">
        🚗 Vigiliner
      </h1>
      <p class="text-slate-400 text-sm mt-2">
        Plataforma de Rastreo Satelital
      </p>
    </div>

    <!-- Form -->
    <form (ngSubmit)="login()" class="space-y-5">

      <div>
        <label class="block text-sm text-slate-400 mb-1">
          Usuario
        </label>
        <input
          type="text"
          [(ngModel)]="email"
          name="email"
          class="w-full px-4 py-2 bg-slate-800 text-white rounded-lg border border-slate-700 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>

      <div>
        <label class="block text-sm text-slate-400 mb-1">
          Contraseña
        </label>
        <input
          type="password"
          [(ngModel)]="password"
          name="password"
          class="w-full px-4 py-2 bg-slate-800 text-white rounded-lg border border-slate-700 focus:outline-none focus:ring-2 focus:ring-green-500"
        />
      </div>

      <button
        type="submit"
        class="w-full py-2 bg-green-600 hover:bg-green-500 transition text-white font-medium rounded-lg"
      >
        Iniciar sesión
      </button>

    </form>

  </div>

</div>
